<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>תרגול למבחן קרני — מיכל</title><meta name="robots" content="noindex">
<style>:root{--bg:#f6f4fb;--card:#fff;--ink:#22223b;--muted:#6b6b80;--pri:#5b4bc4;--pri2:#ece9fb;--ok:#1f8a5b;--okbg:#e5f6ee;--bad:#c0392b;--badbg:#fdecea;--warn:#b7791f;--line:#e2e0ee;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;font-size:17px;line-height:1.5}
a{color:var(--pri)}
.wrap{max-width:1100px;margin:0 auto;padding:14px}
header.top{background:linear-gradient(135deg,#5b4bc4,#7d6fe0);color:#fff;padding:18px 14px;border-radius:0 0 22px 22px}
header.top h1{margin:0;font-size:1.5rem}
header.top .sub{opacity:.9;font-size:.92rem;margin-top:4px}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 3px rgba(40,30,90,.08);padding:16px;margin:14px 0}
.card h2{margin:0 0 10px;font-size:1.2rem}
.card h3{margin:12px 0 8px;font-size:1.05rem}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.exam-card{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:6px}
.exam-card .t{font-weight:700;font-size:1.1rem}
.muted{color:var(--muted);font-size:.9rem}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);font-size:.85rem;font-weight:600}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:right;vertical-align:top}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
select,input[type=number]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri)}
.stat-row{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:6px 0}
.q{font-size:1.08rem}
.q .stem{white-space:pre-line;margin-bottom:10px}
.q .num{font-weight:700;color:var(--pri);margin-left:6px}
.opts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.opts.figopts{grid-template-columns:repeat(4,1fr)}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;cursor:pointer;display:flex;gap:8px;align-items:center;font:inherit;text-align:right;color:inherit}
.opt .lt{font-weight:700;color:var(--pri);min-width:1.2em}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.static{cursor:default}
.figopts .opt{flex-direction:column;padding:6px}
.fig{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0 12px;direction:rtl}
.fig .cell{display:flex;flex-direction:column;align-items:center;font-size:.8rem;color:var(--muted)}
.mgrid{display:grid;grid-template-columns:repeat(3,64px);gap:4px;direction:rtl;margin:6px 0 12px}
.qbox{width:62px;height:62px;border:1.5px dashed var(--pri);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--pri);font-weight:700}
svg.f{background:#fff;border:1px solid #c9c6da;border-radius:6px}
.mono{font-family:"Courier New",Consolas,monospace;font-size:1.25rem;letter-spacing:.12em;font-weight:700}
.seqline{direction:ltr;font-size:1.3rem;font-weight:700;letter-spacing:.03em;text-align:left}
.ltr{direction:ltr;text-align:left}
.feedback{margin-top:12px;padding:10px 12px;border-radius:10px}
.feedback.ok{background:var(--okbg)}.feedback.bad{background:var(--badbg)}
.exam-layout{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
.sheet{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.sheet .srow{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px dotted var(--line)}
.sheet .srow .n{width:28px;font-weight:700;color:var(--muted);text-align:center}
.bub{width:30px;height:30px;border-radius:50%;border:1.5px solid #9a95b8;background:#fff;font:inherit;font-size:.85rem;cursor:pointer;color:#555;padding:0}
.bub.on{background:#2b2350;color:#fff;border-color:#2b2350}
.timerbar{position:sticky;top:0;z-index:5;background:#2b2350;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.timerbar .clock{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.timerbar.low .clock{color:#ffb4a8}
.qitem{border-bottom:1px solid var(--line);padding:14px 0}
.big{font-size:2.2rem;font-weight:800}
.note{font-size:.85rem;color:var(--muted);background:#fbfaff;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
.chart svg{width:100%;height:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.mobile-sheet-toggle{display:none}
@media (max-width:820px){
  .exam-layout{grid-template-columns:1fr}
  .sheet{position:fixed;bottom:0;left:0;right:0;top:auto;max-height:45vh;border-radius:16px 16px 0 0;margin:0;z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.18);display:none}
  .sheet.open{display:block}
  .mobile-sheet-toggle{display:inline-block}
  .opts{grid-template-columns:1fr}
  .opts.figopts{grid-template-columns:1fr 1fr}
  .stat-row{grid-template-columns:110px 1fr 48px}
  body.sheet-open .wrap{padding-bottom:48vh}
}
</style></head><body><div id="app"></div>
<script>window.KARNI_DATA={"exams":[{"id":1,"title":"מבחן 1","sections":[{"id":"verbal_ana","title":"אנלוגיות מילוליות","topic":"verbal","min":9,"q":[{"id":"e1-verbal_ana-1","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  מילה : משפט","o":["מים : כוס","אות : דיו","דף : עט","לבנה : קיר"],"a":3,"e":"היחס: יחידה קטנה שממנה בונים את השלם.","k":"text"},{"id":"e1-verbal_ana-2","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  ספינה : קברניט","o":["מטוס : טייס","אונייה : נמל","רכבת : מסילה","אוטובוס : תחנה"],"a":0,"e":"היחס: כלי תחבורה ומי שמנהיג אותו.","k":"text"},{"id":"e1-verbal_ana-3","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  סופר : ספר","o":["מלחין : מנגינה","קורא : עיתון","מורה : כיתה","נגר : פטיש"],"a":0,"e":"היחס: היוצר והיצירה שלו.","k":"text"},{"id":"e1-verbal_ana-4","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  חרוץ : עצל","o":["חכם : נבון","שמח : עליז","נדיב : קמצן","אמיץ : גיבור"],"a":2,"e":"היחס: תכונות הפוכות.","k":"text"},{"id":"e1-verbal_ana-5","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  תפוח : פרי","o":["לימון : חמוץ","ענב : יין","עגבנייה : אדום","גזר : ירק"],"a":3,"e":"היחס: פריט והקבוצה (הסוג) שהוא שייך אליה.","k":"text"},{"id":"e1-verbal_ana-6","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  כפפות : קור","o":["מנורה : אור","שעון : זמן","מטרייה : גשם","ספר : ידע"],"a":2,"e":"היחס: חפץ ממה שהוא מגן.","k":"text"},{"id":"e1-verbal_ana-7","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  להקה : ציפורים","o":["קן : ציפור","ענף : עץ","יער : עצים","מים : דג"],"a":2,"e":"היחס: קבוצה ומה שהיא מורכבת ממנו.","k":"text"},{"id":"e1-verbal_ana-8","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  ריבוע : קובייה","o":["עיגול : כדור","מלבן : דלת","משולש : שלוש","קו : נקודה"],"a":0,"e":"היחס: צורה שטוחה והגוף התלת־ממדי המתאים לה.","k":"text"},{"id":"e1-verbal_ana-9","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  שבוע : יום","o":["שעה : שעון","שנה : חודש","דקה : שעה","חודש : לבנה"],"a":1,"e":"היחס: יחידת זמן גדולה ויחידת זמן קטנה שהיא מורכבת ממנה (שימי לב: 'דקה : שעה' הוא היחס ההפוך).","k":"text"},{"id":"e1-verbal_ana-10","sec":"verbal_ana","topic":"verbal","q":"איזה זוג מילים מתאים ליחס שבין:  לחישה : צעקה","o":["קרח : מים","רוח : עננים","טפטוף : מבול","ענן : גשם"],"a":2,"e":"היחס: אותו דבר בעוצמה חלשה ובעוצמה חזקה מאוד.","k":"text"}]},{"id":"quant_wp","title":"בעיות כמותיות וחשבון","topic":"quant","min":16,"q":[{"id":"e1-quant_wp-1","sec":"quant_wp","topic":"quant","q":"אוטובוס נוסע במהירות קבועה של 60 קמ\"ש. כמה זמן תימשך נסיעה של 180 ק\"מ?","o":["3 שעות","3 שעות ו-15 דקות","3 שעות וחצי","2 שעות ו-45 דקות"],"a":0,"e":"זמן = דרך ÷ מהירות = 180 ÷ 60 = 3 שעות.","k":"text"},{"id":"e1-quant_wp-2","sec":"quant_wp","topic":"quant","q":"ברז אחד ממלא בריכה ב-4 שעות, וברז שני ממלא אותה ב-12 שעות. בכמה זמן ימלאו שני הברזים יחד את הבריכה?","o":["3 שעות","4 שעות","8 שעות","6 שעות"],"a":0,"e":"בשעה אחת: 1/4 + 1/12 = 1/3 מהבריכה. לכן העבודה כולה: 1 ÷ 1/3 = 3 שעות (3 שעות).","k":"text"},{"id":"e1-quant_wp-3","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-4 מבחנים הוא 85. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 5 המבחנים יהיה 88?","o":["91","104","100","88"],"a":2,"e":"סכום נדרש: 5×88 = 440. סכום קיים: 4×85 = 340. חסר: 100.","k":"text"},{"id":"e1-quant_wp-4","sec":"quant_wp","topic":"quant","q":"בספרייה של הכיתה 80 ספרים. היחס בין ספרי העיון לספרי הסיפורים הוא 5:3. כמה ספרי סיפורים יש?","o":["40","75","30","50"],"a":2,"e":"יש 5+3 = 8 חלקים, כל חלק = 80÷8 = 10. ספרי סיפורים: 3×10 = 30.","k":"text"},{"id":"e1-quant_wp-5","sec":"quant_wp","topic":"quant","q":"דבורה קראה ביום הראשון 2/5 מהספר, וביום השני קראה 1/3 ממה שנשאר. איזה חלק מהספר עוד לא קראה?","o":["2/5","1/5","3/5","2/15"],"a":0,"e":"אחרי היום הראשון נשאר 3/5. ביום השני קראה 1/3 מזה, ולכן נשאר 2/3 × 3/5 = 2/5.","k":"text"},{"id":"e1-quant_wp-6","sec":"quant_wp","topic":"quant","q":"אם כופלים מספר ב-5 ומחסירים 15, מקבלים 50. מהו המספר?","o":["15","12","13","14"],"a":2,"e":"50 + 15 = 65, ו-65 ÷ 5 = 13.","k":"text"},{"id":"e1-quant_wp-7","sec":"quant_wp","topic":"quant","q":"היום דודה מבוגרת מאחייניתה פי 5. בעוד 12 שנים היא תהיה מבוגרת ממנה פי 3. בת כמה האחיינית היום?","o":["12","14","60","10"],"a":0,"e":"נסמן את גיל האחיינית ב-x: 5x + 12 = 3(x + 12), ולכן 2x = 24 ו-x = 12. בדיקה: היום 12 ו-60; בעוד 12 שנים 24 ו-72 = פי 3.","k":"text"},{"id":"e1-quant_wp-8","sec":"quant_wp","topic":"quant","q":"מה התוצאה של התרגיל: 15 + 2 × 6 − 24 ÷ 6 ?","o":["35","98","23","29"],"a":2,"e":"קודם כפל וחילוק: 2×6 = 12, 24÷6 = 4. אחר כך: 15 + 12 − 4 = 23.","k":"text"},{"id":"e1-quant_wp-9","sec":"quant_wp","topic":"quant","q":"לאה קנתה 6 מחברות ב-12 ש\"ח כל אחת ו-3 קלמרים ב-25 ש\"ח כל אחד. היא שילמה ב-250 ש\"ח. כמה עודף קיבלה?","o":["213","103","178","98"],"a":1,"e":"6×12 + 3×25 = 72 + 75 = 147. עודף: 250 − 147 = 103 ש\"ח.","k":"text"},{"id":"e1-quant_wp-10","sec":"quant_wp","topic":"quant","q":"אוטובוס נוסע במהירות קבועה של 40 קמ\"ש. כמה זמן תימשך נסיעה של 60 ק\"מ?","o":["שעה ו-45 דקות","2 שעות וחצי","שעה וחצי","שעה ו-12 דקות"],"a":2,"e":"זמן = דרך ÷ מהירות = 60 ÷ 40 = 3/2 שעות, כלומר שעה וחצי.","k":"text"},{"id":"e1-quant_wp-11","sec":"quant_wp","topic":"quant","q":"ברז אחד ממלא בריכה ב-6 שעות, וברז שני ממלא אותה ב-3 שעות. בכמה זמן ימלאו שני הברזים יחד את הבריכה?","o":["4 שעות","4 שעות וחצי","3 שעות","2 שעות"],"a":3,"e":"בשעה אחת: 1/6 + 1/3 = 1/2 מהבריכה. לכן העבודה כולה: 1 ÷ 1/2 = 2 שעות (2 שעות).","k":"text"},{"id":"e1-quant_wp-12","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-5 מבחנים הוא 88. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 6 המבחנים יהיה 90?","o":["98","92","100","105"],"a":2,"e":"סכום נדרש: 6×90 = 540. סכום קיים: 5×88 = 440. חסר: 100.","k":"text"}]},{"id":"fig_series","title":"סדרות צורות","topic":"fig","min":10,"q":[{"id":"e1-fig_series-1","sec":"fig_series","topic":"fig","q":"איזו צורה ממשי _wp","title":"בעיות כמותיות וחשבון","topic":"quant","min":16,"q":[{"id":"e2-quant_wp-1","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-4 מבחנים הוא 70. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 5 המבחנים יהיה 73?","o":["85","73","76","77"],"a":0,"e":"סכום נדרש: 5×73 = 365. סכום קיים: 4×70 = 280. חסר: 85.","k":"text"},{"id":"e2-quant_wp-2","sec":"quant_wp","topic":"quant","q":"בספרייה של הכיתה 35 ספרים. היחס בין ספרי העיון לספרי הסיפורים הוא 3:4. כמה ספרי סיפורים יש?","o":["15","25","20","32"],"a":2,"e":"יש 3+4 = 7 חלקים, כל חלק = 35÷7 = 5. ספרי סיפורים: 4×5 = 20.","k":"text"},{"id":"e2-quant_wp-3","sec":"quant_wp","topic":"quant","q":"דבורה קראה ביום הראשון 2/7 מהספר, וביום השני קראה 1/2 ממה שנשאר. איזה חלק מהספר עוד לא קראה?","o":["5/7","1/7","3/14","5/14"],"a":3,"e":"אחרי היום הראשון נשאר 5/7. ביום השני קראה 1/2 מזה, ולכן נשאר 1/2 × 5/7 = 5/14.","k":"text"},{"id":"e2-quant_wp-4","sec":"quant_wp","topic":"quant","q":"אם כופלים מספר ב-3 ומחסירים 10, מקבלים 20. מהו המספר?","o":["13","9","12","10"],"a":3,"e":"20 + 10 = 30, ו-30 ÷ 3 = 10.","k":"text"},{"id":"e2-quant_wp-5","sec":"quant_wp","topic":"quant","q":"היום אמא מבוגרת מבתה פי 3. בעוד 4 שנים היא תהיה מבוגרת ממנה פי 2. בת כמה הבת היום?","o":["12","6","8","4"],"a":3,"e":"נסמן את גיל הבת ב-x: 3x + 4 = 2(x + 4), ולכן 1x = 4 ו-x = 4. בדיקה: היום 4 ו-12; בעוד 4 שנים 8 ו-16 = פי 2.","k":"text"},{"id":"e2-quant_wp-6","sec":"quant_wp","topic":"quant","q":"מה התוצאה של התרגיל: 12 + 4 × 7 − 36 ÷ 3 ?","o":["27","31","28","100"],"a":2,"e":"קודם כפל וחילוק: 4×7 = 28, 36÷3 = 12. אחר כך: 12 + 28 − 12 = 28.","k":"text"},{"id":"e2-quant_wp-7","sec":"quant_wp","topic":"quant","q":"לאה קנתה 5 מחברות ב-18 ש\"ח כל אחת ו-2 קלמרים ב-10 ש\"ח כל אחד. היא שילמה ב-150 ש\"ח. כמה עודף קיבלה?","o":["35","40","50","60"],"a":1,"e":"5×18 + 2×10 = 90 + 20 = 110. עודף: 150 − 110 = 40 ש\"ח.","k":"text"},{"id":"e2-quant_wp-8","sec":"quant_wp","topic":"quant","q":"אוטובוס נוסע במהירות קבועה של 50 קמ\"ש. כמה זמן תימשך נסיעה של 150 ק\"מ?","o":["2 שעות ו-45 דקות","2 שעות וחצי","4 שעות","3 שעות"],"a":3,"e":"זמן = דרך ÷ מהירות = 150 ÷ 50 = 3 שעות.","k":"text"},{"id":"e2-quant_wp-9","sec":"quant_wp","topic":"quant","q":"צבעית אחת צובעת קיר ב-2 שעות, וצבעית שנייה צובעת אותו ב-6 שעות. בכמה זמן יצבעו שתיהן יחד את הקיר?","o":["4 שעות","2 שעות","שעה וחצי","3 שעות"],"a":2,"e":"בשעה אחת: 1/2 + 1/6 = 2/3 מהקיר. לכן העבודה כולה: 1 ÷ 2/3 = 3/2 שעות (שעה וחצי).","k":"text"},{"id":"e2-quant_wp-10","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-4 מבחנים הוא 75. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 5 המבחנים יהיה 78?","o":["94","87","90","81"],"a":2,"e":"סכום נדרש: 5×78 = 390. סכום קיים: 4×75 = 300. חסר: 90.","k":"text"},{"id":"e2-quant_wp-11","sec":"quant_wp","topic":"quant","q":"בספרייה של הכיתה 25 ספרים. היחס בין ספרי העיון לספרי הסיפורים הוא 1:4. כמה ספרי סיפורים יש?","o":["24","25","5","20"],"a":3,"e":"יש 1+4 = 5 חלקים, כל חלק = 25÷5 = 5. ספרי סיפורים: 4×5 = 20.","k":"text"},{"id":"e2-quant_wp-12","sec":"quant_wp","topic":"quant","q":"דבורה קראה ביום הראשון 2/7 מהספר, וביום השני קראה 2/3 ממה שנשאר. איזה חלק מהספר עוד לא קראה?","o":["1/21","5/7","5/21","16/21"],"a":2,"e":"אחרי היום הראשון נשאר 5/7. ביום השני קראה 2/3 מזה, ולכן נשאר 1/3 × 5/7 = 5/21.","k":"text"}]},{"id":"fig_series","title":"סדרות צורות","topic":"fig","min":10,"q":[{"id":"e2-fig_series-1","sec":"fig_series","topic":"fig","q":"איזו צורה ממשיכה את הסדרה?","o":[[["c",17,17,17,0,1],["c",43,17,17,0,1],["c",17,43,17,0,1],["c",43,43,17,0,1]],[["d",30,15,17,0,1],["d",16,43,17,0,1],["d",44,43,17,0,1]],[["d",17,17,17,0,0],["d",43,17,17,0,0],["d",17,43,17,0,0],["d",43,43,17,0,0]],[["d",17,17,17,0,1],["d",43,17,17,0,1],["d",17,43,17,0,1],["d",43,43,17,0,1]]],"a":3,"e":"מספר הצורות גדל ב-1 בכל שלב, והצורה מתחלפת לסירוגין: עיגול, מעוין. בשלב הרביעי: 4 צורות של מעוין.","k":"fig","fig":{"seq":[[["c",30,30,30,0,1]],[["d",17,30,20,0,1],["d",43,30,20,0,1]],[["c",30,15,17,0,1],["c",16,43,17,0,1],["c",44,43,17,0,1]]]}},{"id":"e2-fig_series-2","sec":" מבוגרת מאחייניתה פי 7. בעוד 8 שנים היא תהיה מבוגרת ממנה פי 3. בת כמה האחיינית היום?","o":["4","6","12","8"],"a":0,"e":"נסמן את גיל האחיינית ב-x: 7x + 8 = 3(x + 8), ולכן 4x = 16 ו-x = 4. בדיקה: היום 4 ו-28; בעוד 8 שנים 12 ו-36 = פי 3.","k":"text"},{"id":"e3-quant_wp-4","sec":"quant_wp","topic":"quant","q":"מה התוצאה של התרגיל: 17 + 6 × 5 − 48 ÷ 6 ?","o":["38","51","107","39"],"a":3,"e":"קודם כפל וחילוק: 6×5 = 30, 48÷6 = 8. אחר כך: 17 + 30 − 8 = 39.","k":"text"},{"id":"e3-quant_wp-5","sec":"quant_wp","topic":"quant","q":"לאה קנתה 5 מחברות ב-18 ש\"ח כל אחת ו-3 קלמרים ב-14 ש\"ח כל אחד. היא שילמה ב-250 ש\"ח. כמה עודף קיבלה?","o":["132","118","218","113"],"a":1,"e":"5×18 + 3×14 = 90 + 42 = 132. עודף: 250 − 132 = 118 ש\"ח.","k":"text"},{"id":"e3-quant_wp-6","sec":"quant_wp","topic":"quant","q":"אוטובוס נוסע במהירות קבועה של 90 קמ\"ש. כמה זמן תימשך נסיעה של 180 ק\"מ?","o":["2 שעות","3 שעות","4 שעות","שעה ו-48 דקות"],"a":0,"e":"זמן = דרך ÷ מהירות = 180 ÷ 90 = 2 שעות.","k":"text"},{"id":"e3-quant_wp-7","sec":"quant_wp","topic":"quant","q":"ברז אחד ממלא בריכה ב-4 שעות, וברז שני ממלא אותה ב-4 שעות. בכמה זמן ימלאו שני הברזים יחד את הבריכה?","o":["2 שעות","3 שעות","5 שעות","4 שעות"],"a":0,"e":"בשעה אחת: 1/4 + 1/4 = 1/2 מהבריכה. לכן העבודה כולה: 1 ÷ 1/2 = 2 שעות (2 שעות).","k":"text"},{"id":"e3-quant_wp-8","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-5 מבחנים הוא 84. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 6 המבחנים יהיה 86?","o":["101","86","88","96"],"a":3,"e":"סכום נדרש: 6×86 = 516. סכום קיים: 5×84 = 420. חסר: 96.","k":"text"},{"id":"e3-quant_wp-9","sec":"quant_wp","topic":"quant","q":"בספרייה של הכיתה 64 ספרים. היחס בין ספרי העיון לספרי הסיפורים הוא 5:3. כמה ספרי סיפורים יש?","o":["16","24","32","59"],"a":1,"e":"יש 5+3 = 8 חלקים, כל חלק = 64÷8 = 8. ספרי סיפורים: 3×8 = 24.","k":"text"},{"id":"e3-quant_wp-10","sec":"quant_wp","topic":"quant","q":"דבורה קראה ביום הראשון 2/5 מהספר, וביום השני קראה 1/2 ממה שנשאר. איזה חלק מהספר עוד לא קראה?","o":["3/5","1/5","7/10","3/10"],"a":3,"e":"אחרי היום הראשון נשאר 3/5. ביום השני קראה 1/2 מזה, ולכן נשאר 1/2 × 3/5 = 3/10.","k":"text"},{"id":"e3-quant_wp-11","sec":"quant_wp","topic":"quant","q":"אם כופלים מספר ב-3 ומחסירים 13, מקבלים 11. מהו המספר?","o":["9","8","11","16"],"a":1,"e":"11 + 13 = 24, ו-24 ÷ 3 = 8.","k":"text"},{"id":"e3-quant_wp-12","sec":"quant_wp","topic":"quant","q":"היום דודה מבוגרת מאחייניתה פי 4. בעוד 6 שנים היא תהיה מבוגרת ממנה פי 2. בת כמה האחיינית היום?","o":["3","6","7","9"],"a":0,"e":"נסמן את גיל האחיינית ב-x: 4x + 6 = 2(x + 6), ולכן 2x = 6 ו-x = 3. בדיקה: היום 3 ו-12; בעוד 6 שנים 9 ו-18 = פי 2.","k":"text"}]},{"id":"fig_series","title":"סדרות צורות","topic":"fig","min":10,"q":[{"id":"e3-fig_series-1","sec":"fig_series","topic":"fig","q":"איזו צורה ממשיכה את הסדרה?","o":[[["s",30,30,44,0,0],["c",13,13,10,0,0]],[["s",30,30,44,0,0],["c",47,47,10,0,0]],[["s",30,30,44,0,0],["c",47,13,10,0,0]],[["s",30,30,44,0,0],["c",47,13,10,0,1]]],"a":2,"e":"העיגול הקטן זז פינה אחת עם כיוון השעון בכל שלב, ומתחלף בין ריק למלא. בשלב החמישי הוא ריק.","k":"fig","fig":{"seq":[[["s",30,30,44,0,0],["c",47,13,10,0,0]],[["s",30,30,44,0,0],["c",47,47,10,0,1]],[["s",30,30,44,0,0],["c",13,47,10,0,0]],[["s",30,30,44,0,0],["c",13,13,10,0,1]]]}},{"id":"e3-fig_series-2","sec":"fig_series","topic":"fig","q":"איזו צורה ממשיכה את הסדרה?","o":[[["h",30,15,17,0,1],["h",16,43,17,0,1],["h",44,43,17,0,1]],[["h",30,15,17,0,2],["h",16,43,17,0,2],["h",44,43,17,0,2]],[["h",30,30,30,0,1]],[["h",30,15,17,0,0],["h",16,43,17,0,0],["h",44,43,17,0,0]]],"a":0,"e":"המילוי חוזר במחזור: מפוספס, מלא, ריק. מספר הצורות מתחלף: 3, 1, 3, 1... לכן בשלב החמישי: 3 צורות, מלא.","k":"fig","fig":{"seq":[[["h",30,15,17,0,2],["h",16,43,17,0,2],["h",44,43,17,0,2]],[["h",30,30,30,0,1]],[["h",30,15,17,0,0],["h",16,43,17,0,0],["h",44,43,17,0,0]],[["h",30,30,30,0,2]]]}},{"id":"e3-fig_series-3","sec":"fig_series","topic":"fig","q":"איזו צורה ממשיכה את הסדרה?","o":[[["a",30,30,34,270,1]],[["a",30,30,34,45,1]],[["a",30,30,34,225,1]],[["a",3 עות","7 שעות","8 שעות"],"a":0,"e":"בשעה אחת: 1/8 + 1/24 = 1/6 מהקיר. לכן העבודה כולה: 1 ÷ 1/6 = 6 שעות (6 שעות).","k":"text"},{"id":"e4-quant_wp-6","sec":"quant_wp","topic":"quant","q":"הממוצע של שרה ב-5 מבחנים הוא 75. איזה ציון עליה לקבל במבחן הבא כדי שהממוצע של כל 6 המבחנים יהיה 79?","o":["89","104","83","99"],"a":3,"e":"סכום נדרש: 6×79 = 474. סכום קיים: 5×75 = 375. חסר: 99.","k":"text"},{"id":"e4-quant_wp-7","sec":"quant_wp","topic":"quant","q":"בספרייה של הכיתה 30 ספרים. היחס בין ספרי העיון לספרי הסיפורים הוא 2:3. כמה ספרי סיפורים יש?","o":["24","28","18","15"],"a":2,"e":"יש 2+3 = 5 חלקים, כל חלק = 30÷5 = 6. ספרי סיפורים: 3×6 = 18.","k":"text"},{"id":"e4-quant_wp-8","sec":"quant_wp","topic":"quant","q":"דבורה קראה ביום הראשון 2/5 מהספר, וביום השני קראה 1/4 ממה שנשאר. איזה חלק מהספר עוד לא קראה?","o":["9/20","11/20","3/20","7/20"],"a":0,"e":"אחרי היום הראשון נשאר 3/5. ביום השני קראה 1/4 מזה, ולכן נשאר 3/4 × 3/5 = 9/20.","k":"text"},{"id":"e4-quant_wp-9","sec":"quant_wp","topic":"quant","q":"אם כופלים מספר ב-5 ומחסירים 5, מקבלים 75. מהו המספר?","o":["18","17","16","14"],"a":2,"e":"75 + 5 = 80, ו-80 ÷ 5 = 16.","k":"text"},{"id":"e4-quant_wp-10","sec":"quant_wp","topic":"quant","q":"היום דודה מבוגרת מאחייניתה פי 5. בעוד 2 שנים היא תהיה מבוגרת ממנה פי 4. בת כמה האחיינית היום?","o":["6","12","30","8"],"a":0,"e":"נסמן את גיל האחיינית ב-x: 5x + 2 = 4(x + 2), ולכן 1x = 6 ו-x = 6. בדיקה: היום 6 ו-30; בעוד 2 שנים 8 ו-32 = פי 4.","k":"text"},{"id":"e4-quant_wp-11","sec":"quant_wp","topic":"quant","q":"מה התוצאה של התרגיל: 20 + 7 × 6 − 36 ÷ 6 ?","o":["56","62","156","55"],"a":0,"e":"קודם כפל וחילוק: 7×6 = 42, 36÷6 = 6. אחר כך: 20 + 42 − 6 = 56.","k":"text"},{"id":"e4-quant_wp-12","sec":"quant_wp","topic":"quant","q":"לאה קנתה 6 מחברות ב-12 ש\"ח כל אחת ו-3 קלמרים ב-14 ש\"ח כל אחד. היא שילמה ב-300 ש\"ח. כמה עודף קיבלה?","o":["181","186","196","228"],"a":1,"e":"6×12 + 3×14 = 72 + 42 = 114. עודף: 300 − 114 = 186 ש\"ח.","k":"text"}]},{"id":"fig_series","title":"סדרות צורות","topi const h=(tag,attrs,...kids)=>{const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="html")el.innerHTML=v;else if(k==="cls")el.className=v;else el.setAttribute(k,v===true?"":v);}kids.flat().forEach(c=>{if(c==null||c===false)return;el.appendChild(typeof c==="object"?c:document.createTextNode(String(c)));});return el;};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function mmss(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}

let figN=0;
function glyphSVG(g,pid){
  const [sh,cx,cy,sz,rot,fill]=g;const r=sz/2;
  const fillv=fill===1?"#2b2350":fill===2?`url(#${pid})`:"#fff";
  const st=`fill="${fillv}" stroke="#2b2350" stroke-width="1.8"`;
  let p="";
  const poly=pts=>`<polygon points="${pts.map(([x,y])=>(cx+x*r).toFixed(1)+","+(cy+y*r).toFixed(1)).join(" ")}" ${st}/>`;
  if(sh==="c")p=`<circle cx="${cx}" cy="${cy}" r="${r}" ${st}/>`;
  else if(sh==="s")p=`<rect x="${cx-r*0.9}" y="${cy-r*0.9}" width="${r*1.8}" height="${r*1.8}" ${st}/>`;
  else if(sh==="t")p=poly([[0,-1],[0.95,0.8],[-0.95,0.8]]);
  else if(sh==="d")p=poly([[0,-1],[0.8,0],[0,1],[-0.8,0]]);
  else if(sh==="h")p=poly([0,1,2,3,4,5].map(i=>[Math.cos(Math.PI/3*i),Math.sin(Math.PI/3*i)*0.95]));
  else if(sh==="x"){const a=0.33;p=poly([[-a,-1],[a,-1],[a,-a],[1,-a],[1,a],[a,a],[a,1],[-a,1],[-a,a],[-1,a],[-1,-a],[-a,-a]]);}
  else if(sh==="a"){const pts=[[0,-1],[0.62,-0.2],[0.24,-0.2],[0.24,1],[-0.24,1],[-0.24,-0.2],[-0.62,-0.2]];p=`<g transform="rotate(${rot} ${cx} ${cy})">${poly(pts)}</g>`;}
  return p;
}
function frameSVG(glyphs,size){

  return wrap.firstChild;
}

  if(q.k==="en")return h("div",{cls:"stem ltr"},q.q);

  }
  return h("div",{cls:"stem"},q.q);
}
function optContent(q,o){

    w.append(c);
  }
}

// ---------- backup ----------
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="karni-michal-backup-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
function importData(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||x.v!==1)throw new Error("קובץ לא מתאים");
    const ids=new Set(S.attempts.map(a=>a.id));let add=0;(x.attempts||[]).forEach(a=>{if(!ids.has(a.id)){S.attempts.push(a);add++;}});
    S.attempts.sort((a,b)=>a.date<b.date?-1:1);
    for(const k in (x.topic||{})){const t=S.topic[k]||(S.topic[k]={c:0,n:0});if(add){t.c=Math.max(t.c,x.topic[k].c);t.n=Math.max(t.n,x.topic[k].n);}}
    (x.mistakes||[]).forEach(addMistake);save();alert(`נטענו ${add} מבחנים חדשים מהגיבוי.`);home();}catch(e){alert("לא הצלחתי לקרוא את הקובץ: "+e.message);}};
  r.readAsText(f);
}
window.addEventListener("beforeunload",ev=>{if(S.inprog&&S.inprog.phase==="run"){ev.preventDefault();ev.returnValue="";}});
home();
})();
